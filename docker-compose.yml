services:
  instapresi-frontend:
    container_name: instapresi-frontend
    image: ghcr.io/francocsanchez/instapresi-frontend:latest
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
